<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gallery - See the moments of joy, learning, and growth at Progressive Ideal Yatimkhana.">
    <title>Gallery | Progressive Ideal Yatimkhana</title>
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="css/tailwind.css">
    
    <!-- Site Configuration (must be loaded before other scripts) -->
    <script src="js/config.js"></script>
    
    <!-- Common Head Elements (Favicon, Google Fonts) -->
    <script src="js/components/head-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- lightGallery CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/css/lightgallery-bundle.min.css">
</head>
<body class="min-h-screen font-sans antialiased">
    <!-- Header Placeholder (will be replaced by component) -->
    <div id="header-placeholder"></div>
    
    <main id="main-content">
        <!-- Page Header -->
        <section class="relative overflow-hidden bg-gradient-to-b from-primary-50 to-white py-20 lg:py-28">
            <div class="absolute inset-0 -z-10 overflow-hidden" aria-hidden="true">
                <div class="animate-hero-float absolute -top-40 left-1/2 h-[500px] w-[500px] -translate-x-1/2 rounded-full bg-primary-200/50 blur-3xl"></div>
                <div class="animate-hero-float-reverse absolute right-0 top-0 h-[400px] w-[400px] rounded-full bg-accent-200/30 blur-3xl"></div>
            </div>
            <div class="container mx-auto px-4 lg:px-8">
                <div class="mx-auto max-w-3xl text-center">
                    <div class="mb-6 inline-flex items-center gap-2 rounded-full border border-primary-200 bg-primary-50 px-4 py-1.5 text-sm font-medium text-primary-700" data-animate="fade-in-up">Our Gallery</div>
                    <h1 class="text-4xl font-bold tracking-tight text-gray-900 sm:text-5xl lg:text-6xl" data-animate="fade-in-up" data-delay="100">Moments of <span class="text-gradient">Joy & Growth</span></h1>
                    <p class="mx-auto mt-6 max-w-2xl text-lg text-gray-600 sm:text-xl" data-animate="fade-in-up" data-delay="200">Capturing the smiles, learning, and precious moments from our orphanage family.</p>
                </div>
            </div>
        </section>
        
        <!-- Gallery Grid -->
        <section class="py-20 lg:py-28">
            <div class="container mx-auto px-4 lg:px-8">
                <!-- Filter Buttons -->
                <div class="mb-12 flex flex-wrap justify-center gap-3" data-animate="fade-in-up">
                    <button class="gallery-filter active rounded-full px-5 py-2 text-sm font-medium transition-all" data-filter="all">All</button>
                    <button class="gallery-filter rounded-full px-5 py-2 text-sm font-medium transition-all" data-filter="education">Education</button>
                    <button class="gallery-filter rounded-full px-5 py-2 text-sm font-medium transition-all" data-filter="activities">Activities</button>
                    <button class="gallery-filter rounded-full px-5 py-2 text-sm font-medium transition-all" data-filter="events">Events</button>
                    <button class="gallery-filter rounded-full px-5 py-2 text-sm font-medium transition-all" data-filter="facility">Facility</button>
                </div>
                
                <!-- Gallery Grid Container (dynamically populated by gallery.js) -->
                <div id="gallery-container" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                    <!-- Loading skeleton will be shown while data loads -->
                </div>
            </div>
        </section>
        
        <!-- CTA Section -->
        <!-- CTA Section (dynamically rendered by cta-donate.js) -->
        <div data-cta-donate='{"title":"Help Us Create More Memories","description":"Your support helps us continue providing these precious moments for children in need.","buttonText":"Support Our Mission","showImpactExamples":false,"showTrustBadges":false}'></div>
    </main>
    
    <!-- Footer Placeholder (will be replaced by component) -->
    <div id="footer-placeholder"></div>
    
    <!-- Component Scripts -->
    <script src="js/components/scroll-progress.js"></script>
    <script src="js/components/back-to-top.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components/mobile-cta.js"></script>
    <script src="js/components/cta-donate.js"></script>
    <script src="js/components/gallery.js"></script>
    <script src="js/main.js"></script>
    
    <!-- lightGallery JS -->
    <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/lightgallery.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/thumbnail/lg-thumbnail.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/zoom/lg-zoom.umd.js"></script>
    
    <!-- Lightbox Component -->
    <script src="js/components/lightbox.js"></script>
    
    <script>
        // Gallery lightbox and filter functionality
        window.initGalleryLightbox = function() {
            const galleryGrid = document.getElementById('gallery-grid');
            const filterButtons = document.querySelectorAll('.gallery-filter');
            const galleryItems = document.querySelectorAll('.gallery-item');
            let lightGalleryInstance = null;
            
            // Initialize lightGallery using the reusable component
            function initLightGallery() {
                if (lightGalleryInstance) {
                    lightGalleryInstance.destroy();
                }
                
                lightGalleryInstance = initLightbox(galleryGrid, {
                    selector: '.gallery-item:not([style*="display: none"])',
                    plugins: [lgThumbnail, lgZoom],
                    thumbnail: true
                });
            }
            
            // Gallery filter functionality
            filterButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    const filter = this.getAttribute('data-filter');
                    
                    // Update active state
                    filterButtons.forEach(function(btn) {
                        btn.classList.remove('active', 'bg-primary-500', 'text-white');
                        btn.classList.add('bg-gray-100', 'text-gray-700');
                    });
                    this.classList.add('active', 'bg-primary-500', 'text-white');
                    this.classList.remove('bg-gray-100', 'text-gray-700');
                    
                    // Filter items
                    galleryItems.forEach(function(item) {
                        const category = item.getAttribute('data-category');
                        if (filter === 'all' || category === filter) {
                            item.style.display = 'block';
                            item.classList.add('animate-visible');
                        } else {
                            item.style.display = 'none';
                        }
                    });
                    
                    // Reinitialize lightGallery with filtered items
                    initLightGallery();
                });
            });
            
            // Initialize active state
            document.querySelector('.gallery-filter.active').classList.add('bg-primary-500', 'text-white');
            document.querySelector('.gallery-filter.active').classList.remove('bg-gray-100', 'text-gray-700');
            filterButtons.forEach(function(btn) {
                if (!btn.classList.contains('active')) {
                    btn.classList.add('bg-gray-100', 'text-gray-700');
                }
            });
            
            // Initialize lightGallery on page load
            initLightGallery();
        };
    </script>
</body>
</html>
