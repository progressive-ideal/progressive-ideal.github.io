<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stay informed with the latest updates, news, and events from Progressive Ideal Yatimkhana.">
    <title>Updates | Progressive Ideal Yatimkhana</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/tailwind-config.js"></script>
    
    <!-- Common Head Elements (Favicon, Google Fonts) -->
    <script src="../js/components/head-config.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-screen font-sans antialiased">
    <!-- Header Placeholder (will be replaced by component) -->
    <div id="header-placeholder"></div>
    
    <main id="main-content">
        <!-- Page Header -->
        <section class="relative overflow-hidden bg-gradient-to-b from-primary-50 to-white py-20 lg:py-28">
            <div class="absolute inset-0 -z-10 overflow-hidden" aria-hidden="true">
                <div class="animate-hero-float absolute -top-40 left-1/2 h-[500px] w-[500px] -translate-x-1/2 rounded-full bg-primary-200/50 blur-3xl"></div>
                <div class="animate-hero-float-reverse absolute right-0 top-0 h-[400px] w-[400px] rounded-full bg-accent-200/30 blur-3xl"></div>
            </div>
            
            <div class="container mx-auto px-4 lg:px-8">
                <div class="mx-auto max-w-3xl text-center">
                    <div class="mb-6 inline-flex items-center gap-2 rounded-full border border-primary-200 bg-primary-50 px-4 py-1.5 text-sm font-medium text-primary-700" data-animate="fade-in-up">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
                        </svg>
                        Updates
                    </div>
                    <h1 class="text-4xl font-bold tracking-tight text-gray-900 sm:text-5xl lg:text-6xl" data-animate="fade-in-up" data-delay="100">
                        Latest <span class="text-gradient">Updates</span>
                    </h1>
                    <p class="mx-auto mt-6 max-w-2xl text-lg text-gray-600 sm:text-xl" data-animate="fade-in-up" data-delay="200">
                        Stay informed about our latest news, events, milestones, and the impact your support is making in the lives of children.
                    </p>
                </div>
            </div>
        </section>
        
        <!-- Updates Listing -->
        <section class="py-20 lg:py-28">
            <div class="container mx-auto px-4 lg:px-8">
                <div class="mx-auto max-w-4xl">
                    <div id="updates-listing-container" data-updates-source="/updates/updates.json">
                        <!-- Dynamically populated by updates.js -->
                    </div>
                </div>
            </div>
        </section>
        
        <!-- CTA Section (dynamically rendered by cta-donate.js) -->
        <div data-cta-donate='{"title":"Never Miss an Update","description":"Subscribe to our newsletter and stay connected with the latest news, events, and stories from Progressive Ideal Yatimkhana.","buttonText":"Support Our Mission","showImpactExamples":false,"showTrustBadges":false}'></div>
    </main>
    
    <!-- Footer Placeholder (will be replaced by component) -->
    <div id="footer-placeholder"></div>
    
    <!-- Component Scripts -->
    <script src="../js/components/scroll-progress.js"></script>
    <script src="../js/components/back-to-top.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/components/mobile-cta.js"></script>
    <script src="../js/components/updates.js"></script>
    <script src="../js/components/cta-donate.js"></script>
    <!-- JavaScript -->
    <script src="../js/main.js"></script>
</body>
</html>
